---

- name: Establish subscription status
  shell: |
    set -o pipefail
    subscription-manager status | grep -i overall | cut -d ':' -f2 | xargs
  changed_when: false
  register: subscription_status

- name: Ensure the system is registered with a Red Hat subscription using an activation key
  redhat_subscription:
    state: present
    org_id: "{{ rhel_org_id }}"
    activationkey: "{{ rhel_activation_key }}"
    force_register: "{{ 'yes' if subscription_status.stdout != 'Current' else 'no' }}"
  when: rhel_activation_key != ""

- name: Ensure the system is registered with a Red Hat subscription using a poolid
  redhat_subscription:
    state: present
    username: "{{ rhel_username }}"
    password: "{{ rhel_password }}"
    pool_ids: "{{ rhel_pool_id }}"
    force_register: "{{ 'yes' if subscription_status.stdout != 'Current' else 'no' }}"
  when: rhel_pool_id != ""

- name: Ensure all necessary RHEL8 repositories are enabled for this system
  command: >
    subscription-manager repos
    --enable=rhel-8-for-x86_64-baseos-rpms
    --enable=rhel-8-for-x86_64-appstream-rpms
  changed_when: '"" in subscripton_manager_repos.stdout'
  register: subscription_manager_repos

- name: Ensure yum-utils package is installed
  yum:
    name:
      - yum-utils
      - dnf-command(versionlock)
    state: present

- name: Remove versionlocks, if empty
  command:
    cmd: dnf versionlock clear
  changed_when: false
  when:
    - exclude_list | length == 0

- name: Set versionlocks
  command:
    cmd: dnf versionlock add '{{ (exclude_list + exclude_list_extra) | join(" ") }}'
  changed_when: '"Adding versionlock on" in dnf_versionlock.stdout'
  register: dnf_versionlock
  when:
    - exclude_list | length > 0
    - ansible_domain == "library.ucla.edu"
